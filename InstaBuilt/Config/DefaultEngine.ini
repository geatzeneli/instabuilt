; InstaBuilt/Config/DefaultEngine.ini
; Milestone 1: Project Foundation configuration

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/PrototypeLevel.PrototypeLevel
EditorStartupMap=/Game/Maps/PrototypeLevel.PrototypeLevel
GlobalDefaultGameMode=/Script/InstaBuiltGame.InstaBuiltGameMode
GameInstanceClass=/Script/InstaBuiltGame.InstaBuiltGameInstance

[/Script/Engine.Engine]
; Disable unused UE5 features to reduce overhead
bUseStaticMeshNanite=True
bEnableLumen=True
bEnableVirtualShadowMaps=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[Core.Log]
; Enable all InstaBuilt log categories in development
LogInstaBuilt=Verbose
LogIB_ECS=Verbose
LogIB_EventBus=Verbose
LogIB_Building=Verbose
LogIB_Construction=Verbose
LogIB_Contract=Verbose
LogIB_Worker=Verbose
LogIB_Economy=Verbose
LogIB_Save=Verbose
