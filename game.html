function makeHouse(w,d,h,wall,roof){const g=new T.Group();for(let x=-w/2-0.5;x<=w/2+0.5;x++)for(let z=-d/2-0.5;z<=d/2+0.5;z++)g.add(v(x,0.15,z,MT.fd));for(let x=-w/2;x<=w/2;x++)for(let y=1;y<=h;y++){g.add(v(x,y,-d/2,wall));g.add(v(x,y,d/2,wall))}for(let z=-d/2;z<=d/2;z++)for(let y=1;y<=h;y++){g.add(v(-w/2,y,z,wall));g.add(v(w/2,y,z,wall))}for(let x=-w/2;x<=w/2;x++)for(let z=-d/2;z<=d/2;z++)g.add(v(x,0.5,z,MT.fl));const wc2=Math.max(1,Math.floor(w/2));for(let i=0;i<wc2;i++){const wx=-w/2+1.5+i*(w-3)/(wc2-1||1);g.add(v(wx,h-1,-d/2-0.1,MT.wi));g.add(v(wx,2,-d/2-0.1,MT.wi));if(Math.random()<0.6){g.add(v(wx,h-1,d/2+0.1,MT.wi));g.add(v(wx,2,d/2+0.1,MT.wi))}}g.add(v(0,1,-d/2-0.1,MT.dr));g.add(v(0,2,-d/2-0.1,MT.dr));const rm=new T.MeshLambertMaterial({color:roof});for(let x=-w/2-1;x<=w/2+1;x++)for(let z=-d/2-1;z<=d/2+1;z++)g.add(v(x,h+1,z,rm));for(let x=-w/2;x<=w/2;x++){g.add(v(x,h+1.5,-d/2-0.5,rm));g.add(v(x,h+1.5,d/2+0.5,rm))}for(let z=-d/2;z<=d/2;z++){g.add(v(-w/2-0.5,h+1.5,z,rm));g.add(v(w/2+0.5,h+1.5,z,rm))}if(w>=4)for(let x=-w/2;x<=w/2;x++)g.add(v(x,0.5,-d/2-1,MT.tr));g.children.forEach(c=>{c.castShadow=true;c.receiveShadow=true});return g}

 else if(hasH&&ch&&fp.obj&&fp.dist<5.5){const h=ch,f=fp.obj;ch.position.copy(f.position);ch.position.y=0.3;f.children.forEach(c=>{if(c.userData&&c.userData.isF)c.material=MT.fd});deliveredHouses.add(h);usedFoundations.add(f);hasH=false;ch=null;batchDelivered++;dust(f.position.x,f.position.y,f.position.z);beep(600,0.08,0.07);setTimeout(()=>beep(900,0.1,0.08),60);if(batchDelivered>=batchSize){completeBatch()}else{updDots();updObj()}}
}
function completeBatch(){nb++;const bonus=getPay()*batchSize*1.5;money+=bonus;document.getElementById('money').textContent='$'+money;document.getElementById('nb').textContent=nb;document.getElementById('rating').textContent=nb<3?'★':nb<8?'★★':nb<18?'★★★':nb<35?'★★★★':'★★★★★';for(let i=0;i<80;i++){const s=new T.SphereGeometry(0.15,3,3),m=new T.MeshBasicMaterial({color:i%3?'#ffd700':'#fff'}),p=new T.Mesh(s,m);p.position.copy(batchFoundations[0].position);p.position.y+=2;p.userData={vx:(Math.random()-0.5)*8,vy:Math.random()*8+3,vz:(Math.random()-0.5)*8,life:1.2+Math.random()*0.6};S.add(p);particles.push(p)}const el=document.createElement('div');el.className='mp';el.textContent='🏘️ +$'+Math.floor(bonus);el.style.left='35%';el.style.top='30%';el.style.fontSize='28px';document.getElementById('ui').appendChild(el);setTimeout(()=>el.remove(),1500);beep(523,0.1,0.08);setTimeout(()=>beep(659,0.1,0.08),100);setTimeout(()=>beep(784,0.15,0.1),200);setTimeout(()=>beep(1047,0.2,0.1),350);document.getElementById('obj').textContent='🏘️ NEIGHBORHOOD COMPLETE! +$'+Math.floor(bonus);document.getElementById('hint').style.display='none';setTimeout(spawnBatch,2000);updShop()}
function updDots(){const bd=document.getElementById('batch');bd.innerHTML='';for(let i=0;i<batchSize;i++){const d=document.createElement('div');d.className='dot'+(i<batchDelivered?' done':'');bd.appendChild(d)}}
function updObj(){const el=document.getElementById('obj'),h=document.getElementById('hint');el.textContent=hasH?'🏗️ Deliver to a foundation! ('+batchDelivered+'/'+batchSize+')':'🚚 Pick up a house! ('+batchDelivered+'/'+batchSize+')';h.textContent=hasH?'Press E to place':'Press E to pick up';h.style.display='block'}
function updShop(){['s','p'].forEach((k,i)=>{const c=[500,500][i]*([sl,pl][i]);document.getElementById('c'+k).textContent='$'+c;document.getElementById('l'+k).textContent=[sl,pl][i];document.getElementById('u'+k).disabled=money<c})}
window.buy=function(t){const costs={speed:sl*500,pay:pl*500};const c=costs[t];if(money<c)return;money-=c;if(t==='speed')sl++;if(t==='pay')pl++;document.getElementById('money').textContent='$'+money;updShop();beep(1000,0.1,0.07)};updShop();

document.addEventListener('keydown',e=>{if(e.key==='w'||e.key==='W')keys.w=1;if(e.key==='a'||e.key==='A')keys.a=1;if(e.key==='s'||e.key==='S')keys.s=1;if(e.key==='d'||e.key==='D')keys.d=1;if(e.key==='Shift')keys.sh=1;if(e.key==='e'||e.key==='E')interact()});
document.addEventListener('keyup',e=>{if(e.key==='w'||e.key==='W')keys.w=0;if(e.key==='a'||e.key==='A')keys.a=0;if(e.key==='s'||e.key==='S')keys.s=0;if(e.key==='d'||e.key==='D')keys.d=0;if(e.key==='Shift')keys.sh=0});

let cy=0,cp=0.45,ty=0,tp=0.45,md=0;
document.addEventListener('mousedown',e=>{if(e.button===0)md=1});document.addEventListener('mouseup',()=>md=0);
document.addEventListener('mousemove',e=>{if(md){ty-=e.movementX*0.004;tp=Math.max(-0.2,Math.min(1.1,tp-e.movementY*0.004))}});
document.addEventListener('wheel',e=>{C.position.y=Math.max(8,Math.min(40,C.position.y+e.deltaY*0.03))});

const mm=document.getElementById('mmc'),mx=mm.getContext('2d');
function drawMM(){mx.clearRect(0,0,120,120);mx.fillStyle='rgba(0,0,0,0.4)';mx.fillRect(0,0,120,120);mx.fillStyle='#555';mx.fillRect(0,38,120,4);mx.fillRect(0,66,120,4);mx.fillRect(38,0,4,120);mx.fillRect(66,0,4,120);mx.fillStyle='#3B9B55';mx.beginPath();mx.arc(60+truck.position.x*0.35,60-truck.position.z*0.45,3,0,Math.PI*2);mx.fill();batchHouses.forEach(h=>{if(h&&!deliveredHouses.has(h)){mx.fillStyle=(hasH&&ch===h)?'#ff0':'#fa0';mx.beginPath();mx.arc(60+h.position.x*0.35,60-h.position.z*0.45,2,0,Math.PI*2);mx.fill()}});batchFoundations.forEach(f=>{if(f&&!usedFoundations.has(f)){mx.fillStyle='#3B9B55';mx.beginPath();mx.arc(60+f.position.x*0.35,60-f.position.z*0.45,2,0,Math.PI*2);mx.fill()}})}

let lt=0,ds=0;
function tick(dt){
 if(dt>0.1)dt=0.1;const sp=getSpd()*(keys.sh?1.7:1);let mx2=0,mz=0;
 if(keys.w)mz-=1;if(keys.s)mz+=1;if(keys.a)mx2-=1;if(keys.d)mx2+=1;
 if(mx2||mz){const l=Math.sqrt(mx2*mx2+mz*mz);mx2/=l;mz/=l;const a=Math.atan2(mx2,mz)+cy;truck.position.x+=Math.sin(a)*sp*dt;truck.position.z+=Math.cos(a)*sp*dt;truck.rotation.y=-a+Math.PI;ds+=dt;if(ds>0.25){beep(60,0.04,0.015);ds=0}}
 truck.position.x=Math.max(-95,Math.min(95,truck.position.x));truck.position.z=Math.max(-55,Math.min(55,truck.position.z));
 if(hasH&&ch){ch.position.x+=(truck.position.x-ch.position.x)*4*dt;ch.position.z+=(truck.position.z-ch.position.z)*4*dt;ch.position.y=truck.position.y+4}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;if(p.userData.life<=0){S.remove(p);particles.splice(i,1);continue}p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;p.userData.vy-=6*dt;p.scale.setScalar(Math.max(0,p.userData.life))}
}
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-lt)/1000,0.1);lt=t;tick(dt);cy+=(ty-cy)*6*dt;cp+=(tp-cp)*6*dt;const cx=truck.position.x+Math.sin(cy)*16,cz=truck.position.z+Math.cos(cy)*16;C.position.x+=(cx-C.position.x)*4*dt;C.position.z+=(cz-C.position.z)*4*dt;C.position.y+=(truck.position.y+12+Math.sin(cp)*12-C.position.y)*4*dt;C.lookAt(truck.position.x,truck.position.y+1,truck.position.z);drawMM();R.render(S,C)}

spawnBatch();requestAnimationFrame(frame);
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
