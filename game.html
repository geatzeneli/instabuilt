function makeHouse(w,d,h,wall,roof){

 // Corner trim (darker)
 for(let y=1;y<=h;y++){g.add(v(-w/2,y,-d/2,MT.wd));g.add(v(w/2,y,-d/2,MT.wd));g.add(v(-w/2,y,d/2,MT.wd));g.add(v(w/2,y,d/2,MT.wd))}
 // Windows with sills
 const wc2=Math.max(1,Math.floor(w/2));
 for(let i=0;i<wc2;i++){
  const wx=-w/2+1.5+i*(w-3)/(wc2-1||1);
  g.add(v(wx,h-1,-d/2-0.1,MT.wi));g.add(v(wx,2,-d/2-0.1,MT.wi)); // Front windows
  g.add(v(wx,1,-d/2-0.1,MT.wd)); // Window sill
  if(Math.random()<0.7){g.add(v(wx,h-1,d/2+0.1,MT.wi));g.add(v(wx,2,d/2+0.1,MT.wi));g.add(v(wx,1,d/2+0.1,MT.wd))}}
 // Front door with steps
 g.add(v(0,1,-d/2-0.1,MT.dr));g.add(v(0,2,-d/2-0.1,MT.dr));
 for(let x=-1;x<=1;x++){g.add(v(x,0.5,-d/2-1,MT.wd));g.add(v(x,0.5,-d/2-2,MT.wd))} // Porch steps
 // Roof structure
 const rm=new T.MeshLambertMaterial({color:RF});
 for(let x=-w/2-1;x<=w/2+1;x++)for(let z=-d/2-1;z<=d/2+1;z++)g.add(v(x,h+1,z,rm));
 // Gable ends
 for(let x=-w/2;x<=w/2;x++){g.add(v(x,h+1.5,-d/2-0.5,rm));g.add(v(x,h+1.5,d/2+0.5,rm))}
 for(let z=-d/2;z<=d/2;z++){g.add(v(-w/2-0.5,h+1.5,z,rm));g.add(v(w/2+0.5,h+1.5,z,rm))}

 // Porch roof over door
 if(w>=4){for(let x=-2;x<=2;x++){g.add(v(x,h+0.5,-d/2-1,MT.tr));g.add(v(x,h+1,-d/2-2,MT.wd))}}
 g.children.forEach(c=>{c.castShadow=true;c.receiveShadow=true});return g}
function makeFoundation(w,d){const g=new T.Group();for(let x=-w/2-1;x<=w/2+1;x++)for(let z=-d/2-1;z<=d/2+1;z++){const b=v(x,0.2,z,MT.fd);b.userData={isF:true};g.add(b)}return g}
const catalog=[{w:3,d:3,h:2,wall:MT.wa,roof:'#c44a4a',pay:200},{w:3,d:3,h:2,wall:MT.wb,roof:'#8b4513',pay:220},{w:5,d:3,h:2,wall:MT.wa,roof:'#a0522d',pay:350},{w:5,d:3,h:2,wall:MT.wc,roof:'#555',pay:380},{w:6,d:4,h:3,wall:MT.wa,roof:'#6b3a2a',pay:600},{w:3,d:2,h:2,wall:MT.wb,roof:'#c44a4a',pay:180},{w:5,d:4,h:3,wall:MT.wa,roof:'#8b4513',pay:500}];

let money=0,nb=0,sl=1,pl=1,zl=1,hasH=false,ch=null,particles=[],batchHouses=[],batchFoundations=[],deliveredHouses=new Set(),usedFoundations=new Set(),batchDelivered=0,batchSize=4,deliveryTimer=0,animHouse=null,animTarget=null,animProgress=0,totalDeliveries=0,totalMoney=0,achievements=new Set(),placedHouses=[];
const truckColors=[MT.tr,MT.td,new T.MeshLambertMaterial({color:'#e74c3c'}),new T.MeshLambertMaterial({color:'#d4a017'}),new T.MeshLambertMaterial({color:'#1a5276'}),new T.MeshLambertMaterial({color:'#6c3483'})];
const truckAccents=[MT.td,MT.tr,new T.MeshLambertMaterial({color:'#c0392b'}),new T.MeshLambertMaterial({color:'#b8860b'}),new T.MeshLambertMaterial({color:'#154360'}),new T.MeshLambertMaterial({color:'#512e5f'})];
const styleNames=['Green','Red','Gold','Blue','Purple'];
const arrowGeo=new T.ConeGeometry(0.3,1,4);const arrowMat=new T.MeshBasicMaterial({color:'#ffd700'});
const arrow=new T.Mesh(arrowGeo,arrowMat);arrow.visible=false;arrow.renderOrder=999;arrow.material.depthTest=false;S.add(arrow);
const keys={w:0,a:0,s:0,d:0,sh:0};
function getPay(){return 200+(pl-1)*100}function getSpd(){return 10+(sl-1)*2.5}
function spawnBatch(){
 // Cleanup after 16 houses fill the map
 if(placedHouses.length>=16){placedHouses.forEach(h=>{if(h)S.remove(h)});placedHouses=[]}
 // Remove only unpicked houses (not in placedHouses)
 batchHouses.forEach(h=>{if(h&&!placedHouses.includes(h))S.remove(h)});
 batchFoundations.forEach(f=>{if(f)S.remove(f)});
 batchHouses=[];batchFoundations=[];deliveredHouses=new Set();usedFoundations=new Set();batchDelivered=0;batchSize=4+Math.floor(nb/3);if(batchSize>8)batchSize=8;
 const atHQ=Math.max(1,Math.floor(batchSize*0.7));
 for(let i=0;i<batchSize;i++){const e=catalog[Math.floor(Math.random()*Math.min(catalog.length,3+nb))];let hx,hz,fx,fz;
  if(i<atHQ){const bay=yardBays[Math.floor(Math.random()*yardBays.length)];hx=bay.x;hz=bay.z}else{do{hx=(Math.random()-0.5)*150;hz=(Math.random()-0.5)*90}while(Math.abs(hz-8)<6||Math.abs(hz+8)<6||Math.abs(hz-22)<6||Math.abs(hz+22)<6)}
  do{fx=(Math.random()-0.5)*130;fz=(Math.random()-0.5)*80}while(Math.abs(fz-8)<6||Math.abs(fz+8)<6||Math.abs(fz-22)<6||Math.abs(fz+22)<6);
  const ho=makeHouse(e.w,e.d,e.h,e.wall,e.roof);ho.position.set(hx,0.3,hz);S.add(ho);
  const fo=makeFoundation(e.w,e.d);fo.position.set(fx,0.1,fz);S.add(fo);gl(ho,true);gl(fo,false,true);
  batchHouses.push(ho);batchFoundations.push(fo);
 }updDots();updObj();
}
function gl(obj,house,fnd){obj.children.forEach(c=>{if(house&&c.material.emissive){c.material.emissive=new T.Color('#553300');c.material.emissiveIntensity=0.5}if(fnd&&c.userData&&c.userData.isF)c.material=MT.fg})}
function dust(x,y,z,n){for(let i=0;i<(n||12);i++){const s=new T.SphereGeometry(0.08,3,3),m=new T.MeshBasicMaterial({color:'#ccb999'}),p=new T.Mesh(s,m);p.position.set(x,y,z);p.userData={vx:(Math.random()-0.5)*2,vy:Math.random()*3+1,vz:(Math.random()-0.5)*2,life:0.6+Math.random()*0.4};S.add(p);particles.push(p)}}
let actx=null,musicGain=null,musicOn=false;
function tone(f,d,v,t,s){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext);const o=actx.createOscillator(),g=actx.createGain();o.type=t||'triangle';o.frequency.setValueAtTime(f,actx.currentTime);s&&o.frequency.exponentialRampToValueAtTime(s,actx.currentTime+d*0.7);g.gain.setValueAtTime((v||0.05)*2.5,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}
function noise(d,v){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext);const buf=actx.createBuffer(1,actx.sampleRate*d,actx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const src=actx.createBufferSource(),g=actx.createGain();src.buffer=buf;g.gain.setValueAtTime((v||0.03)*2,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);src.connect(g);g.connect(actx.destination);src.start()}
const sfx={
 pickup(){tone(120,0.25,0.08,'sine',60);noise(0.2,0.04);setTimeout(()=>tone(180,0.2,0.06,'sine'),100)},
 place(){tone(80,0.2,0.1,'sine');noise(0.25,0.06);setTimeout(()=>tone(60,0.25,0.06,'triangle'),80)},
 money(){tone(600,0.08,0.08,'sine',900);setTimeout(()=>{tone(800,0.08,0.08,'sine',1200);tone(1000,0.06,0.05,'sine')},50)},
 complete(){tone(400,0.12,0.1,'sine',600);setTimeout(()=>tone(500,0.12,0.1,'sine',800),80);setTimeout(()=>{tone(600,0.15,0.12,'sine',1000);tone(800,0.1,0.06,'triangle')},160);setTimeout(()=>tone(1000,0.18,0.12,'sine'),250)},
 click(){tone(800,0.04,0.05,'sine')},
 buy(){tone(400,0.06,0.06,'sine',800);setTimeout(()=>tone(600,0.06,0.06,'sine',1000),40);setTimeout(()=>tone(1200,0.08,0.07,'triangle'),80)},
 engine(v){if(Math.random()<v*0.3){tone(50+v*15,0.1,0.008*v,'sawtooth')}}
};
// Background music - simple lo-fi loop
const notes=[262,294,330,349,392,349,330,294,262,330,392,440,392,330,294,262];
let noteIdx=0,noteTimer=0;
function playMusic(dt){
 if(!musicOn)return;
 if(!actx)actx=new(window.AudioContext||window.webkitAudioContext);
 noteTimer+=dt;
 const noteLen=0.4;
 if(noteTimer>=noteLen){noteTimer-=noteLen;noteIdx=(noteIdx+1)%notes.length;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.value=notes[noteIdx];
  g.gain.setValueAtTime(0.015,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+noteLen*0.9);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+noteLen*0.9);
  // Bass note every 4 beats
  if(noteIdx%4===0){
   const bo=actx.createOscillator(),bg=actx.createGain();
   bo.type='sine';bo.frequency.value=notes[noteIdx]*0.5;
   bg.gain.setValueAtTime(0.02,actx.currentTime);
   bg.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+noteLen*1.5);
   bo.connect(bg);bg.connect(actx.destination);
   bo.start();bo.stop(actx.currentTime+noteLen*1.5);
  }
 }
}
// Start music on first user interaction
document.addEventListener('keydown',function startMusic(){musicOn=true;document.removeEventListener('keydown',startMusic)},{once:true});
function getNearest(arr){let best=null,bd=1e9;for(const o of arr){const d=truck.position.distanceTo(o.position);if(d<bd){bd=d;best=o}}return{obj:best,dist:bd}}

function interact(){
 const availHouses=batchHouses.filter(h=>!deliveredHouses.has(h)&&h!==ch);
 const availFounds=batchFoundations.filter(f=>!usedFoundations.has(f));
 const hp=getNearest(availHouses);
 const fp=getNearest(availFounds);
 if(!hasH&&hp.obj&&hp.dist<5.5){hasH=true;ch=hp.obj;ch.children.forEach(c=>{if(c.material.emissive)c.material.emissiveIntensity=0});dust(hp.obj.position.x,hp.obj.position.y,hp.obj.position.z);sfx.pickup();deliveryTimer=0;updObj()}
 else if(hasH&&ch&&fp.obj&&fp.dist<5.5){const h=ch,f=fp.obj;animHouse=ch;animTarget=f;animProgress=0;deliveredHouses.add(h);usedFoundations.add(f);hasH=false;ch=null;batchDelivered++;
  const timeBonus=Math.max(0,Math.floor(100-deliveryTimer*2));const pay=getPay()+timeBonus;money+=pay;document.getElementById('money').textContent='$'+money;
  const el2=document.createElement('div');el2.className='mp';el2.textContent='+$'+pay+(timeBonus>0?' ⚡':'');el2.style.left=(40+Math.random()*20)+'%';el2.style.top=(35+Math.random()*15)+'%';document.getElementById('ui').appendChild(el2);setTimeout(()=>el2.remove(),1000);
  sfx.money();updShop();checkAchievements();
  if(batchDelivered>=batchSize){setTimeout(completeBatch,800)}else{updDots();updObj()}}
}
function completeBatch(){nb++;const bonus=getPay()*batchSize*1.5;money+=bonus;document.getElementById('money').textContent='$'+money;document.getElementById('nb').textContent=nb;document.getElementById('rating').textContent=nb<3?'★':nb<8?'★★':nb<18?'★★★':nb<35?'★★★★':'★★★★★';for(let i=0;i<80;i++){const s=new T.SphereGeometry(0.15,3,3),m=new T.MeshBasicMaterial({color:i%3?'#ffd700':'#fff'}),p=new T.Mesh(s,m);p.position.copy(batchFoundations[0].position);p.position.y+=2;p.userData={vx:(Math.random()-0.5)*8,vy:Math.random()*8+3,vz:(Math.random()-0.5)*8,life:1.2+Math.random()*0.6};S.add(p);particles.push(p)}const el=document.createElement('div');el.className='mp';el.textContent='🏘️ +$'+Math.floor(bonus);el.style.left='35%';el.style.top='30%';el.style.fontSize='28px';document.getElementById('ui').appendChild(el);setTimeout(()=>el.remove(),1500);sfx.complete();document.getElementById('obj').textContent='🏘️ NEIGHBORHOOD COMPLETE! +$'+Math.floor(bonus);document.getElementById('hint').style.display='none';setTimeout(spawnBatch,2000);updShop()}
function updDots(){const bd=document.getElementById('batch');bd.innerHTML='';for(let i=0;i<batchSize;i++){const d=document.createElement('div');d.className='dot'+(i<batchDelivered?' done':'');bd.appendChild(d)}}
function updObj(){const el=document.getElementById('obj'),h=document.getElementById('hint');el.textContent=hasH?'🏗️ Deliver to a foundation! ('+batchDelivered+'/'+batchSize+')':'🚚 Pick up a house! ('+batchDelivered+'/'+batchSize+')';h.textContent=hasH?'Press E to place':'Press E to pick up';h.style.display='block'}
function updShop(){['s','p','z'].forEach((k,i)=>{const c=[500,500,300][i]*([sl,pl,zl][i]);document.getElementById('c'+k).textContent='$'+c;const lv=[sl,pl,zl][i];const dn=['speed','pay','style'];document.getElementById('l'+k).textContent=dn[i]==='style'?styleNames[(zl-1)%styleNames.length]:lv;document.getElementById('u'+k).disabled=money<c})}
function showAchievement(icon,title,sub){
 if(achievements.has(title))return;achievements.add(title);
 const a=document.getElementById('achieve');
 a.querySelector('.achIcon').textContent=icon;
 a.querySelector('.achTitle').textContent=title;
 a.querySelector('.achSub').textContent=sub;
 a.classList.remove('show');void a.offsetWidth;a.classList.add('show');
 setTimeout(()=>a.classList.remove('show'),2800);
}
function checkAchievements(){
 totalDeliveries++;totalMoney+=getPay();
 if(totalDeliveries===1)showAchievement('🏆','First Delivery!','Welcome to InstaBuilt');
 if(totalDeliveries===5)showAchievement('⭐','5 Houses Delivered','Building a reputation');
 if(totalDeliveries===10)showAchievement('🌟','10 Houses!','The neighborhood is growing');
 if(totalDeliveries===25)showAchievement('💫','25 Houses!','A true builder');
 if(!hasH&&deliveryTimer<12&&deliveryTimer>0.1)showAchievement('⚡','Speed Demon!','Delivered in under 12 seconds');
 if(totalMoney>=2000&&!achievements.has('Big Spender'))showAchievement('💎','Big Spender!','Earned over $2,000');
 if(nb>=10)showAchievement('🏘️','Town Builder','10 neighborhoods complete');
}
window.buy=function(t){const costs={speed:sl*500,pay:pl*500,style:zl*300};const c=costs[t];if(money<c)return;money-=c;if(t==='speed')sl++;if(t==='pay')pl++;if(t==='style'){zl++;const i=(zl-1)%truckColors.length;const nc=truckColors[i],na=truckAccents[i];truck.children.forEach(c2=>{if(c2.material===MT.tr||c2.material===truckColors[(i+4)%truckColors.length])c2.material=nc;if(c2.material===MT.td||c2.material===truckAccents[(i+4)%truckAccents.length])c2.material=na})}document.getElementById('money').textContent='$'+money;updShop();sfx.buy()};updShop();

document.addEventListener('keydown',e=>{if(e.key==='w'||e.key==='W')keys.w=1;if(e.key==='a'||e.key==='A')keys.a=1;if(e.key==='s'||e.key==='S')keys.s=1;if(e.key==='d'||e.key==='D')keys.d=1;if(e.key==='Shift')keys.sh=1;if(e.key==='e'||e.key==='E')interact()});
document.addEventListener('keyup',e=>{if(e.key==='w'||e.key==='W')keys.w=0;if(e.key==='a'||e.key==='A')keys.a=0;if(e.key==='s'||e.key==='S')keys.s=0;if(e.key==='d'||e.key==='D')keys.d=0;if(e.key==='Shift')keys.sh=0});

let cy=0,cp=0.45,ty=0,tp=0.45,md=0;
document.addEventListener('mousedown',e=>{if(e.button===0)md=1});document.addEventListener('mouseup',()=>md=0);
document.addEventListener('mousemove',e=>{if(md){ty-=e.movementX*0.004;tp=Math.max(-0.2,Math.min(1.1,tp-e.movementY*0.004))}});
document.addEventListener('wheel',e=>{C.position.y=Math.max(8,Math.min(40,C.position.y+e.deltaY*0.03))});

const mm=document.getElementById('mmc'),mx=mm.getContext('2d');
function drawMM(){mx.clearRect(0,0,120,120);mx.fillStyle='rgba(0,0,0,0.4)';mx.fillRect(0,0,120,120);mx.fillStyle='#555';mx.fillRect(0,38,120,4);mx.fillRect(0,66,120,4);mx.fillRect(38,0,4,120);mx.fillRect(66,0,4,120);mx.fillStyle='#3B9B55';mx.beginPath();mx.arc(60+truck.position.x*0.35,60-truck.position.z*0.45,3,0,Math.PI*2);mx.fill();batchHouses.forEach(h=>{if(h&&!deliveredHouses.has(h)){mx.fillStyle=(hasH&&ch===h)?'#ff0':'#fa0';mx.beginPath();mx.arc(60+h.position.x*0.35,60-h.position.z*0.45,2,0,Math.PI*2);mx.fill()}});batchFoundations.forEach(f=>{if(f&&!usedFoundations.has(f)){mx.fillStyle='#3B9B55';mx.beginPath();mx.arc(60+f.position.x*0.35,60-f.position.z*0.45,2,0,Math.PI*2);mx.fill()}})}

let lt=0,ds=0,vx=0,vz=0;
function tick(dt){
 if(dt>0.05)dt=0.05;playMusic(dt);const sp=getSpd()*(keys.sh?1.7:1);let mx2=0,mz2=0;
 if(keys.w)mz2-=1;if(keys.s)mz2+=1;if(keys.a)mx2-=1;if(keys.d)mx2+=1;
 if(mx2||mz2){const l=Math.sqrt(mx2*mx2+mz2*mz2);mx2/=l;mz2/=l;vx+=(mx2*sp-vx)*6*dt;vz+=(mz2*sp-vz)*6*dt}else{vx+=(0-vx)*4*dt;vz+=(0-vz)*4*dt}
 truck.position.x+=vx*dt;truck.position.z+=vz*dt;
 if(Math.abs(vx)>0.2||Math.abs(vz)>0.2){const rx=mx2||vx,rz=mz2||vz;const targetRot=Math.atan2(-rx,-rz);let diff=targetRot-truck.rotation.y;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;truck.rotation.y+=diff*10*dt;ds+=dt;const sp2=Math.sqrt(vx*vx+vz*vz);if(ds>0.3){sfx.engine(sp2/15);ds=0}}
 truck.position.x=Math.max(-90,Math.min(90,truck.position.x));truck.position.z=Math.max(-50,Math.min(50,truck.position.z));
 if(hasH&&ch){ch.position.x+=(truck.position.x-ch.position.x)*8*dt;ch.position.z+=(truck.position.z-ch.position.z)*8*dt;ch.position.y+=(truck.position.y+5-ch.position.y)*8*dt;deliveryTimer+=dt;document.getElementById('timer').textContent=Math.floor(deliveryTimer)+'s'}
 // NPC cars
 npcCars.forEach(car=>{car.position.x+=car.userData.spd*car.userData.dir*dt;if(car.position.x>95)car.position.x=-95;if(car.position.x<-95)car.position.x=95});
 // Arrow pointer to nearest target
 const target=hasH?(batchFoundations.find(f=>!usedFoundations.has(f))):(batchHouses.find(h=>!deliveredHouses.has(h)&&h!==ch));
 if(target){arrow.visible=true;arrow.position.set(target.position.x,target.position.y+5,target.position.z);arrow.rotation.y=Date.now()*0.003}else{arrow.visible=false}
 // Placement animation
 if(animHouse&&animTarget){animProgress+=dt*3;const t2=Math.min(1,animProgress);animHouse.position.copy(animTarget.position);animHouse.position.y=animTarget.position.y+3*(1-t2);if(t2>=1){animHouse.position.y=0.3;animTarget.children.forEach(c=>{if(c.userData&&c.userData.isF)c.material=MT.fd});animHouse.children.forEach(c=>{if(c.userData&&c.userData.isPad)c.material=new T.MeshLambertMaterial({color:'#f0efe8'})});dust(animTarget.position.x,animTarget.position.y,animTarget.position.z);animHouse=null;animTarget=null}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;if(p.userData.life<=0){S.remove(p);particles.splice(i,1);continue}p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;p.userData.vy-=6*dt;p.scale.setScalar(Math.max(0,p.userData.life))}
}
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-lt)/1000,0.1);lt=t;tick(dt);cy+=(ty-cy)*6*dt;cp+=(tp-cp)*6*dt;const cx=truck.position.x+Math.sin(cy)*16,cz=truck.position.z+Math.cos(cy)*16;C.position.x+=(cx-C.position.x)*4*dt;C.position.z+=(cz-C.position.z)*4*dt;C.position.y+=(truck.position.y+22+Math.sin(cp)*10-C.position.y)*5*dt;C.lookAt(truck.position.x,truck.position.y+1,truck.position.z);drawMM();R.render(S,C)}

spawnBatch();requestAnimationFrame(frame);
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
